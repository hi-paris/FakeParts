[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fakeparts"
version = "0.1.0"
description = "Generation, detection, and evaluation tools for the FakeParts video-forgery benchmark."
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ziyi Liu" },
    { name = "Firas Gabetni" },
    { name = "Awais Hussain Sani" },
    { name = "Xi Wang" },
    { name = "Soobash Daiboo" },
    { name = "Gaetan Brison" },
    { name = "Gianni Franchi" },
    { name = "Vicky Kalogeiton" },
]
keywords = ["video-forensics", "deepfake-detection", "video-generation", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "albumentations>=2.0.8,<3",
    "catalyst>=22.4,<23",
    "datasets>=5.1.0,<6",
    "einops>=0.8.2,<0.9",
    "face-alignment>=1.5.0,<2",
    "fairscale>=0.4.13,<0.5",
    "huggingface-hub>=2.2.0,<3",
    "iopath>=0.1.10,<0.2",
    "lightning>=2.6.6,<3",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.0,<3",
    "omegaconf>=2.4.0,<3",
    "openai-clip>=1.0.1,<2",
    "opencv-python-headless>=5.0.0.93,<6",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.1.0,<4",
    "pillow>=13.0.0,<14",
    "protobuf>=7.36.2,<8",
    "pyarrow>=26.0.0,<27",
    "pyyaml>=6.0,<7",
    "pytorch-metric-learning>=2.9.0,<3",
    "pytorch-warmup>=0.2.0,<0.3",
    "scipy>=1.18.1,<2",
    "tensorboard>=2.21.0,<3",
    "tensorboardx>=2.6.5,<3",
    "timm>=1.0.30,<2",
    "torch>=2.13.0,<2.14",
    "torchvision>=0.28.0,<0.29",
    "tqdm>=4.70.1,<5",
    "transformers>=5.22.1,<6",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://github.com/hi-paris/FakeParts"
Repository = "https://github.com/hi-paris/FakeParts"
Dataset = "https://huggingface.co/datasets/hi-paris/FakeParts"

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
